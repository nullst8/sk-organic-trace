services:
  - type: web
    name: sikkim-organic-trace
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANCHOR_FORCE_LOCAL
        value: "true"
      - key: ANCHOR_RPC_URL
        sync: false
      - key: ANCHOR_PRIVATE_KEY
        sync: false
      - key: ANCHOR_CHAIN_ID
        sync: false
      - key: ANCHOR_CONTRACT_ADDRESS
        sync: false
